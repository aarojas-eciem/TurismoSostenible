document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

mal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f588eb5f-5ded-4883-8fa0-9d7f02cb3648\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"44a3de79-42ff-495b-9be5-e3f8c611c76e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body{margin:0}\n  .ig-bar-track{background:#E7DECE;border-radius:999px;height:7px;flex:1;overflow:hidden}\n  .ig-bar-fill{height:100%;border-radius:999px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width:100%;max-width:1400px;margin:0 auto;box-sizing:border-box;background:#FBF8F1;color:#2A2420;font-family:'Hanken Grotesk',system-ui,sans-serif;padding:60px 40px 50px;letter-spacing:-0.003em\">\n\n  <div style=\"text-align:center;margin-bottom:44px\">\n    <div style=\"font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8C8172;font-weight:700;margin-bottom:14px\">Estudio de mercado turístico ZOIT · Región de Coquimbo<\u002Fdiv>\n    <h1 style=\"font-family:'Spectral',Georgia,serif;font-size:38px;font-weight:600;color:#2C3350;letter-spacing:-0.015em;margin-bottom:12px\">Perfil del turista con alta orientación sostenible<\u002Fh1>\n    <p style=\"font-size:14px;color:#4C4439;max-width:760px;margin:0 auto;line-height:1.6\">Datos reales de la encuesta aplicada, comparados entre las dos zonas ZOIT. Insumo para el diseño de la infografía.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFFFFF;border:1px solid #E7DECE;border-radius:20px;padding:24px 30px;margin-bottom:32px\">\n    <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C79A45;font-weight:700;margin-bottom:10px\">Cómo se construyó el segmento<\u002Fdiv>\n    <p style=\"font-size:12.5px;color:#2A2420;line-height:1.65\">El segmento se define por el Índice de valoración sostenible, que combina seis variables declaradas por cada persona encuestada: la importancia atribuida a la sostenibilidad al elegir el destino, la preferencia por restaurantes y alojamientos con prácticas responsables, la disposición a pagar un porcentaje adicional en cada uno de ellos, y la disposición a aumentar el gasto si el destino mejorara sus prácticas sostenibles. Cada variable se normalizó en una escala de 0 a 100 y el puntaje final es el promedio simple de las seis. Sobre la muestra combinada de 196 personas se calcularon los terciles de esta distribución: \"alta orientación sostenible\" agrupa a quienes obtuvieron 61,1 puntos o más (71 personas en total), umbral aplicado por igual a ambas zonas para mantener la comparación entre ellas.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px\">\n\n    <!-- ═════════ VALLE DEL ELQUI ═════════ -->\n    <div style=\"background:#FFFFFF;border:1px solid #E7DECE;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:26px\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid #E7DECE\">\n        <span style=\"width:14px;height:14px;border-radius:50%;background:#6E7A44;flex-shrink:0\"><\u002Fspan>\n        <div>\n          <h2 style=\"font-family:'Spectral',serif;font-size:22px;font-weight:600;color:#2C3350;letter-spacing:-0.01em\">Valle del Elqui<\u002Fh2>\n          <div style=\"font-size:11.5px;color:#8C8172;margin-top:2px\">n = 40 casos de alta orientación sostenible, sobre 100 encuestados en la zona<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px\">\n        <div style=\"background:#F6EFE2;border-radius:12px;padding:14px 14px 12px\">\n          <div style=\"font-family:'Spectral',serif;font-size:28px;font-weight:600;color:#2A2420\">40<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#4C4439;margin-top:4px;font-weight:600\">encuestados<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#F6EFE2;border-radius:12px;padding:14px 14px 12px\">\n          <div style=\"font-family:'Spectral',serif;font-size:28px;font-weight:600;color:#2A2420\">40%<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#4C4439;margin-top:4px;font-weight:600\">de la muestra de la zona<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#F6EFE2;border-radius:12px;padding:14px 14px 12px\">\n          <div style=\"font-family:'Spectral',serif;font-size:28px;font-weight:600;color:#2A2420\">75,3<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#4C4439;margin-top:4px;font-weight:600\">índice de valoración sostenible<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#F6EFE2;border-radius:12px;padding:14px 14px 12px\">\n          <div style=\"font-family:'Spectral',serif;font-size:28px;font-weight:600;color:#2A2420\">100<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#4C4439;margin-top:4px;font-weight:600\">proxy de recomendación neta<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C79A45;font-weight:700;margin-bottom:12px\">¿Quién es?<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:#2A2420\">\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:#4C4439\">Edad predominante<\u002Fspan><b>55 a 64 años (30%)<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:#4C4439\">Género<\u002Fspan><b>Femenino (57,5%)<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:#4C4439\">Grupo de viaje<\u002Fspan><b>En pareja sin hijos (32,5%)<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:#4C4439\">Transporte<\u002Fspan><b>Automóvil propio/familiar (90%)<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:#4C4439\">Reserva<\u002Fspan><b>Plataforma digital — Booking/Airbnb (44%)<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:#4C4439\">Visitante recurrente<\u002Fspan><b>60% ha vuelto 4+ veces<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:#4C4439\">Fuente de información<\u002Fspan><b>Experiencia propia de visitas anteriores (67,5%)<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C79A45;font-weight:700;margin-bottom:12px\">¿Qué busca?<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#2A2420;margin-bottom:10px\"><span style=\"color:#4C4439\">Motivación principal — <\u002Fspan><b>Descanso y relax (40%)<\u002Fb><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:11.5px;color:#4C4439;width:190px;flex-shrink:0\">Comer en restaurante<\u002Fspan><div class=\"ig-bar-track\"><div class=\"ig-bar-fill\" style=\"width:82.5%;background:#6E7A44\"><\u002Fdiv><\u002Fdiv><b style=\"font-size:11.5px;width:40px;text-align:right\">82,5%<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:11.5px;color:#4C4439;width:190px;flex-shrink:0\">Compra de productos locales<\u002Fspan><div class=\"ig-bar-track\"><div class=\"ig-bar-fill\" style=\"width:72.5%;background:#6E7A44\"><\u002Fdiv><\u002Fdiv><b style=\"font-size:11.5px;width:40px;text-align:right\">72,5%<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:11.5px;color:#4C4439;width:190px;flex-shrink:0\">Legado Gabriela Mistral<\u002Fspan><div class=\"ig-bar-track\"><div class=\"ig-bar-fill\" style=\"width:65%;background:#6E7A44\"><\u002Fdiv><\u002Fdiv><b style=\"font-size:11.5px;width:40px;text-align:right\">65%<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:11.5px;color:#4C4439;width:190px;flex-shrink:0\">Fotografía de paisaje<\u002Fspan><div class=\"ig-bar-track\"><div class=\"ig-bar-fill\" style=\"width:57.5%;background:#6E7A44\"><\u002Fdiv><\u002Fdiv><b style=\"font-size:11.5px;width:40px;text-align:right\">57,5%<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C79A45;font-weight:700;margin-bottom:12px\">Sostenibilidad y disposición a pagar<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:11.5px;color:#4C4439;width:230px;flex-shrink:0\">Sostenibilidad importante al elegir destino<\u002Fspan><div class=\"ig-bar-track\"><div class=\"ig-bar-fill\" style=\"width:97.5%;background:#3E7B74\"><\u002Fdiv><\u002Fdiv><b style=\"font-size:11.5px;width:40px;text-align:right\">97,5%<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:11.5px;color:#4C4439;width:230px;flex-shrink:0\">Prefiere restaurante responsable<\u002Fspan><div class=\"ig-bar-track\"><div class=\"ig-bar-fill\" style=\"width:77.5%;background:#3E7B74\"><\u002Fdiv><\u002Fdiv><b style=\"font-size:11.5px;width:40px;text-align:righ r-radius:6px;background:#A99B87;color:#fff;flex-shrink:0\">III<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;background:#F6EFE2;border-radius:10px;padding:10px 14px\">\n            <span style=\"font-family:'Spectral',serif;font-weight:700;font-size:13px;color:#2C3350;width:28px;flex-shrink:0\">A18<\u002Fspan>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-size:12px;font-weight:600;color:#2A2420\">Información digital actualizada<\u002Fdiv><div style=\"font-size:10px;color:#8C8172;margin-top:1px\">D5 Información · Imp. 4,19 / Des. 3,21<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:11px;font-weight:700;color:#B04A32;flex-shrink:0\">−0,98<\u002Fspan>\n            <span style=\"font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;background:#A99B87;color:#fff;flex-shrink:0\">III<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;background:#F6EFE2;border-radius:10px;padding:10px 14px\">\n            <span style=\"font-family:'Spectral',serif;font-weight:700;font-size:13px;color:#2C3350;width:28px;flex-shrink:0\">A01<\u002Fspan>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-size:12px;font-weight:600;color:#2A2420\">Higiene y mantención de instalaciones<\u002Fdiv><div style=\"font-size:10px;color:#8C8172;margin-top:1px\">D1 Calidad básica · Imp. 4,58 / Des. 3,65<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:11px;font-weight:700;color:#B04A32;flex-shrink:0\">−0,94<\u002Fspan>\n            <span style=\"font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;background:#5F6E3B;color:#fff;flex-shrink:0\">II<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;background:#F6EFE2;border-radius:10px;padding:10px 14px\">\n            <span style=\"font-family:'Spectral',serif;font-weight:700;font-size:13px;color:#2C3350;width:28px;flex-shrink:0\">A17<\u002Fspan>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-size:12px;font-weight:600;color:#2A2420\">Señalética y mapas físicos<\u002Fdiv><div style=\"font-size:10px;color:#8C8172;margin-top:1px\">D5 Información · Imp. 4,42 / Des. 3,48<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:11px;font-weight:700;color:#B04A32;flex-shrink:0\">−0,94<\u002Fspan>\n            <span style=\"font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;background:#B04A32;color:#fff;flex-shrink:0\">I<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"display:flex;justify-content:center;gap:22px;margin-top:8px;font-size:10.5px;color:#4C4439\">\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:9px;height:9px;border-radius:3px;background:#B04A32;display:inline-block\"><\u002Fspan>Cuadrante I — Concentrarse aquí<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:9px;height:9px;border-radius:3px;background:#5F6E3B;display:inline-block\"><\u002Fspan>Cuadrante II — Mantener<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:9px;height:9px;border-radius:3px;background:#A99B87;display:inline-block\"><\u002Fspan>Cuadrante III — Baja prioridad<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:9px;height:9px;border-radius:3px;background:#C79A45;display:inline-block\"><\u002Fspan>Cuadrante IV — Posible despilfarro<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFFFFF;border:1px solid #E7DECE;border-radius:20px;padding:26px 30px;margin-top:20px\">\n    <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C79A45;font-weight:700;margin-bottom:14px\">Qué significa cada cuadrante<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px\">\n      <div style=\"border-left:3px solid #B04A32;padding-left:12px\"><div style=\"font-size:12.5px;font-weight:700;color:#B04A32;margin-bottom:4px\">I — Concentrarse aquí<\u002Fdiv><div style=\"font-size:11px;color:#4C4439;line-height:1.5\">Alta importancia, bajo desempeño. Prioridad máxima de intervención.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-left:3px solid #5F6E3B;padding-left:12px\"><div style=\"font-size:12.5px;font-weight:700;color:#5F6E3B;margin-bottom:4px\">II — Mantener el buen trabajo<\u002Fdiv><div style=\"font-size:11px;color:#4C4439;line-height:1.5\">Alta importancia, alto desempeño. Fortaleza del destino, mantener inversión.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-left:3px solid #A99B87;padding-left:12px\"><div style=\"font-size:12.5px;font-weight:700;color:#A99B87;margin-bottom:4px\">III — Baja prioridad<\u002Fdiv><div style=\"font-size:11px;color:#4C4439;line-height:1.5\">Baja importancia, bajo desempeño. No urgente, monitoreo de largo plazo.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-left:3px solid #C79A45;padding-left:12px\"><div style=\"font-size:12.5px;font-weight:700;color:#C79A45;margin-bottom:4px\">IV — Posible despilfarro<\u002Fdiv><div style=\"font-size:11px;color:#4C4439;line-height:1.5\">Baja importancia, alto desempeño. Posible sobreinversión relativa.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFFFFF;border:1px solid #E7DECE;border-radius:20px;padding:32px 36px;margin-top:20px\">\n    <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C79A45;font-weight:700;margin-bottom:14px\">Síntesis interpretativa — brechas de experiencia<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;font-size:13px;color:#2A2420;line-height:1.7\">\n      <p>Las dos zonas comparten una misma debilidad estructural: la información para el visitante. Señalética y mapas físicos (A17) aparece como brecha de cuadrante I —alta importancia, bajo desempeño— en ambas zonas, y la información digital actualizada (A18) figura entre las cinco brechas más grandes en las dos. Para el segmento de alta orientación sostenible, que valora casi de forma unánime los atributos ambientales (97,5% en Valle del Elqui y 96,7% en Pichidangui–Quilimarí), no encontrar información clara sobre el destino contradice directamente su forma de viajar.<\u002Fp>\n      <p>Las zonas se distinguen en dónde está la urgencia real. En Valle del Elqui, la brecha más grande en magnitud (A18, información digital, −0,95) cae en cuadrante III: el visitante la nota, pero no la considera tan determinante, por lo que no es la prioridad de inversión. Esa prioridad la marca A17 (señalética, −0,56, cuadrante I), de menor magnitud pero de mayor importancia relativa. En Pichidangui–Quilimarí, en cambio, la brecha más grande es también la más urgente: la integración con la cultura local (A16, −1,19, cuadrante I) combina el mayor déficit del segmento con la mayor importancia atribuida, lo que la convierte en la intervención de mayor prioridad de las dos zonas.<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:#2A2420;line-height:1.7;margin-top:16px\">En conjunto, la lectura sugiere dos tareas distintas para un mismo segmento: en el Valle del Elqui, resolver la orientación física del visitante (señalética) sin necesidad de una inversión digital tan intensa; en Pichidangui–Quilimarí, trabajar la conexión con la identidad cultural del territorio —además de higiene de instalaciones (A01, −0,94, cuadrante II) y evidencia de cuidado ambiental (A15, −1,05)— para cerrar una brecha de experiencia notoriamente más amplia que la observada en el Valle del Elqui.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#F6EFE2;border:1px solid #E7DECE;border-radius:12px;padding:14px 20px;font-size:11px;color:#4C4439;margin-top:20px;line-height:1.6;text-align:center\">\n    Datos extraídos directamente del panel interactivo del estudio, sin modificación. Segmento definido por Índice de valoración sostenible alto. Trabajo de campo, 2026.\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
